name: rust-tools-harness

on:
  push:
    paths: ["skills/rust-tools-harness/**", ".github/workflows/rust-tools-harness.yml", "CATALOGUE.md"]
  pull_request:
    # CATALOGUE.md: a tool added to the catalogue must come with curated metadata (test_readme_in_sync)
    paths: ["skills/rust-tools-harness/**", ".github/workflows/rust-tools-harness.yml", "CATALOGUE.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    # registry consistency, parsers (fixtures), executor, rollback, MCP — no extra tools needed
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: skills/rust-tools-harness
        run: |
          set -o pipefail
          python -m unittest tests/test_harness.py tests/test_parsers.py tests/test_undo_mcp.py tests/test_agent.py tests/test_builtins.py tests/test_features.py tests/test_compose_remote.py -v 2>&1 | tee unit.log
      - name: Annotate failing tests
        if: failure()
        working-directory: skills/rust-tools-harness
        shell: bash
        run: |
          python - <<'PY'
          import re
          txt = open("unit.log", encoding="utf-8", errors="replace").read()
          for block in re.split(r"^={10,}$", txt, flags=re.M)[1:]:
              parts = re.split(r"^-{10,}$", block.strip(), flags=re.M)
              head = parts[0].strip().splitlines()[0] if parts and parts[0].strip() else ""
              tb = [l.strip() for l in (parts[1] if len(parts) > 1 else "").strip().splitlines() if l.strip()]
              tail = " | ".join(tb[-3:])[:900]
              if head.startswith(("FAIL:", "ERROR:")):
                  print(f"::error title={head[:120]}::{tail}")
          PY

  windows:
    # pure-Python fallbacks, parsers and registry on Windows (no Unix tools assumed). Not yet run: first CI run validates it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Portable tests
        working-directory: skills/rust-tools-harness
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests/test_parsers.py tests/test_builtins.py -v 2>&1 | tee win.log
      - name: Annotate failing tests
        if: failure()
        working-directory: skills/rust-tools-harness
        shell: bash
        run: |
          python - <<'PY'
          import re
          txt = open("win.log", encoding="utf-8", errors="replace").read()
          for block in re.split(r"^={10,}$", txt, flags=re.M)[1:]:
              parts = re.split(r"^-{10,}$", block.strip(), flags=re.M)
              head = parts[0].strip().splitlines()[0] if parts and parts[0].strip() else ""
              tb = [l.strip() for l in (parts[1] if len(parts) > 1 else "").strip().splitlines() if l.strip()]
              tail = " | ".join(tb[-3:])[:900]
              if head.startswith(("FAIL:", "ERROR:")):
                  print(f"::error title={head[:120]}::{tail}")
          PY

  live:
    # every adapter against real binaries; fails if a pinned tool silently falls back
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RTH_LIVE_REQUIRE: fd,rg,sd,jaq,dust,diskus,procs,hexyl,ouch,difft,xcp,tokei,hyperfine,eza,bat,rust-parallel
      RTH_LIVE_WRITES: "1"
      RTH_LIVE_REPORT: ${{ github.workspace }}/live-${{ matrix.os }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Rust tools (prebuilt via cargo-binstall)
        run: |
          for c in fd-find ripgrep sd jaq du-dust diskus procs hexyl ouch difftastic xcp tokei hyperfine eza bat rust-parallel trippy rustscan; do
            cargo binstall --no-confirm --locked "$c" || echo "::warning::binstall failed for $c"
          done
      - name: Install native fallbacks (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq tree mtr-tiny traceroute nmap trash-cli unzip
      - name: Install native fallbacks (macOS)
        if: runner.os == 'macOS'
        run: brew install jq tree mtr nmap || true
      - name: Tool versions
        run: python skills/rust-tools-harness/bin/rth env --versions
      - name: All tests (including live adapters)
        working-directory: skills/rust-tools-harness
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee live.log
      - name: Annotate failing tests
        if: failure()
        working-directory: skills/rust-tools-harness
        shell: bash
        run: |
          python - <<'PY'
          import re
          txt = open("live.log", encoding="utf-8", errors="replace").read()
          for block in re.split(r"^={10,}$", txt, flags=re.M)[1:]:
              parts = re.split(r"^-{10,}$", block.strip(), flags=re.M)
              head = parts[0].strip().splitlines()[0] if parts and parts[0].strip() else ""
              tb = [l.strip() for l in (parts[1] if len(parts) > 1 else "").strip().splitlines() if l.strip()]
              tail = " | ".join(tb[-3:])[:900]
              if head.startswith(("FAIL:", "ERROR:")):
                  print(f"::error title={head[:120]}::{tail}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-matrix-${{ matrix.os }}
          path: live-${{ matrix.os }}.json
